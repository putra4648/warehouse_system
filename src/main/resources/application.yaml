server:
  port: 7000

vaadin:
  excludeUrls: /swagger-ui/**

spring:
  main:
    banner-mode: off
  jackson:
    property-naming-strategy: SNAKE_CASE
  sql:
    init:
      mode: always
  threads:
    virtual:
      enabled: true
  data:
    web:
      pageable:
        one-indexed-parameters: true
  application:
    name: wms
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        "[format_sql]": true
  security:
    oauth2:
      client:
        registration:
          auth0:
            provider: auth0
            client-id: BbHkKCcwY6WVX8s9OAtV6jxsv4WE0lZH
            client-secret: i5Ov7eFk8rFNuFc7HMPDQH5HaA8Ixg47NHyupZwBftTr8CEgKTjkmN4QWyEhqDiM
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope: openid,profile
        provider:
          auth0:
            issuer-uri: https://dev-t6rkpv6j.au.auth0.com/
logging:
  level:
    "[org.springframework.security]": DEBUG
    "[com.zaxxer.hikari.HikariConfig]": DEBUG
    "[com.zaxxer.hikari]": DEBUG

management:
  metrics:
    tags:
      application: ${spring.application.name}
  prometheus:
    metrics:
      export:
        enabled: true
  endpoint:
    health:
      access: read-only
      show-details: always
    metrics:
      access: read-only
    prometheus:
      access: read-only
  endpoints:
    web:
      exposure:
        include:
          - prometheus
          - health
          - metrics
          - info
